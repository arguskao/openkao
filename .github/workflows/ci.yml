name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Wrangler config check
        working-directory: backend
        run: npm run wrangler:check

      - name: Wrangler generated types check
        working-directory: backend
        run: npm run types:wrangler:check

      - name: TypeScript typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Worker integration tests
        working-directory: backend
        run: npm test

      - name: D1 migration tests
        working-directory: backend
        run: npm run test:migrations

      - name: Wrangler dry-run
        working-directory: backend
        run: npm run dry-run

      - name: Unsigned iOS build
        run: |
          xcodebuild build \
            -project openvoKao.xcodeproj \
            -scheme openvoKao \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ci-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvoKao-unsigned-simulator-app
          path: build/ci-derived-data/Build/Products/Debug-iphonesimulator/openvoKao.app
          if-no-files-found: error
